{% extends "base.html" %}
{% set active_page = 'library' %}

{% block view %}
<div id="view-container">
    <h2 class="text-4xl font-black tracking-tighter mb-8 italic">LIBRARY</h2>
    <div id="library-content"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('library-content');
        if (App.Library.songs.length === 0) {
            container.innerHTML = `<p class="text-center mt-20 opacity-40">No liked tracks</p>`;
        } else {
            let html = '';
            App.Library.songs.forEach(s => {
                const safeTitle = escAttr(s.title);
                const safeArtist = escAttr(s.artist);
                const thumb = s.thumbnail
                    ? `<img src="${s.thumbnail}" class="w-10 h-10 rounded-full object-cover shrink-0">`
                    : `<div class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center shrink-0"><i data-lucide="music" class="w-4 h-4"></i></div>`;
                html += `<div class="glass-pill p-4 rounded-2xl flex items-center gap-4 mb-3 active:scale-95 transition-transform"
                    onclick="App.playTrack('${s.id}','${safeTitle}','${safeArtist}',null,'${s.thumbnail||''}')">
                    ${thumb}
                    <div class="min-w-0"><p class="font-bold text-sm truncate">${s.title}</p><p class="text-xs text-zinc-500 truncate">${s.artist}</p></div>
                    <i data-lucide="play" class="w-4 h-4 ml-auto shrink-0 text-zinc-500"></i>
                </div>`;
            });
            container.innerHTML = html;
        }
        lucide.createIcons();
    });
</script>
{% endblock %}
