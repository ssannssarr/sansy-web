<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sansy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            width: 100vw;
            min-height: 100vh;
        }
        .glass-pill {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .active-nav-item i { filter: drop-shadow(0 0 8px rgba(255,255,255,0.6)); color: #ffffff; }
        .active-nav-item span { text-shadow: 0 0 10px rgba(255,255,255,0.4); color: #ffffff; }
        .inactive-nav-item { color: #444444; }
        .sidebar-transition { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .full-player-transition { transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
        @keyframes rotate-disk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .playing-disk { animation: rotate-disk 8s linear infinite; }
        .playing-disk.paused { animation-play-state: paused; }
        #content-area::-webkit-scrollbar { width: 0px; }
        .video-container { transition: all 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .tap-highlight-none { -webkit-tap-highlight-color: transparent; outline: none; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ffffff; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        /* Progress bar — tall hit area, thin visual track */
        /* Fallback layout if Tailwind CDN is unavailable */
        .hidden { display: none !important; }
        .opacity-0 { opacity: 0 !important; }
        .pointer-events-none { pointer-events: none !important; }
        .-translate-x-full { transform: translateX(-100%); }
        .translate-y-full { transform: translateY(100%); }
        .translate-y-0 { transform: translateY(0); }
        body > main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        #sidebar-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
        }
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 18rem;
            z-index: 90;
        }
        #full-player {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #content-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }
        #view-container {
            min-height: 12rem;
            display: block;
        }
        #bottom-dock {
            position: fixed;
            z-index: 50;
        }
        #queue-drawer {
            position: fixed;
            inset: 0;
            z-index: 90;
        }
        #queue-panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        #progress-bar-wrap {
            height: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }
        #progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: #ffffff;
            width: 0%;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: width 0.3s linear;
        }

        @media (min-width: 1024px) {
            body {
                display: grid;
                grid-template-columns: 18rem 1fr;
                overflow: hidden;
            }
            #sidebar-overlay {
                display: none;
            }
            #sidebar {
                position: static;
                width: 18rem;
                height: 100vh;
                transform: none !important;
                z-index: 20;
                background: #050505;
            }
            #sidebar > button {
                pointer-events: none;
            }
            main {
                min-width: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            main header {
                height: 5.5rem;
                padding-left: 3rem;
                padding-right: 3rem;
            }
            main header button {
                pointer-events: none;
            }
            #content-area {
                padding-left: 3rem;
                padding-right: 3rem;
                padding-bottom: 8rem;
            }
            #view-container {
                max-width: 980px;
                margin: 0 auto;
            }
            #bottom-dock {
                left: 18rem;
                right: 0;
                bottom: 1.5rem;
                transform: none;
                justify-content: center;
                pointer-events: none;
            }
            #bottom-dock > * {
                pointer-events: auto;
            }
            #full-player {
                inset: 0 0 0 auto;
                width: min(460px, 36vw);
                min-width: 420px;
                border-left: 1px solid rgba(255,255,255,0.1);
                box-shadow: -30px 0 80px rgba(0,0,0,0.5);
                transform: translateX(100%) !important;
            }
            #full-player.translate-y-0 {
                transform: translateX(0) !important;
            }
            #full-player.translate-y-full {
                transform: translateX(100%) !important;
            }
            #full-player .flex-1 {
                flex: 0 0 auto;
            }
            #video-frame {
                max-height: 260px;
            }
            #queue-drawer {
                left: 18rem;
            }
            #queue-panel {
                left: auto;
                right: 2rem;
                bottom: 2rem;
                width: min(460px, calc(100vw - 22rem));
                max-height: min(720px, calc(100vh - 4rem));
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 16px;
                transform: translateY(24px) scale(0.98);
                opacity: 0;
            }
            #queue-panel:not(.translate-y-full) {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            #queue-list {
                max-height: min(664px, calc(100vh - 7.5rem));
            }
        }
    </style>
</head>
<body class="flex flex-col select-none">

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 z-[80] bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500" onclick="App.toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-black/95 border-r border-white/5 z-[90] sidebar-transition -translate-x-full p-8 flex flex-col">
        <button onclick="App.toggleSidebar()" class="tap-highlight-none mb-12 text-left">
            <h1 class="text-2xl font-black tracking-tighter uppercase italic text-white">Sansy</h1>
        </button>
        <nav class="space-y-8">
            <div class="space-y-4">
                <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-600 font-bold">Menu</p>
                <button onclick="App.setView('home'); App.toggleSidebar();" class="flex items-center gap-4 text-zinc-100 w-full tap-highlight-none">
                    <i data-lucide="home" class="w-5 h-5 text-white"></i>
                    <span class="font-semibold">Home</span>
                </button>
                <button onclick="App.setView('search'); App.toggleSidebar();" class="flex items-center gap-4 text-zinc-400 w-full tap-highlight-none">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <span>Search</span>
                </button>
                <button onclick="App.setView('library'); App.toggleSidebar();" class="flex items-center gap-4 text-zinc-100 w-full tap-highlight-none">
                    <i data-lucide="heart" class="w-5 h-5 text-white"></i>
                    <span class="font-semibold">Liked Songs</span>
                </button>
                <button onclick="App.setView('settings'); App.toggleSidebar();" class="flex items-center gap-4 text-zinc-400 w-full tap-highlight-none">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>Settings</span>
                </button>
            </div>
        </nav>
    </aside>

    <!-- Full Player -->
    <div id="full-player" class="fixed inset-0 z-[60] bg-black full-player-transition translate-y-full flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="p-6 flex items-center justify-between">
            <button onclick="App.toggleFullPlayer()" class="p-2 glass-pill rounded-full tap-highlight-none">
                <i data-lucide="chevron-down" class="w-6 h-6 text-white"></i>
            </button>
            <p class="text-[10px] uppercase tracking-widest text-zinc-400 font-bold">Now Playing</p>
            <div class="relative">
                <button onclick="App.toggleOptionsMenu(event)" class="p-2 tap-highlight-none">
                    <i data-lucide="more-vertical" class="w-5 h-5 text-white"></i>
                </button>
                <div id="options-menu" class="absolute right-0 top-12 glass-pill p-2 rounded-2xl w-56 opacity-0 pointer-events-none scale-95 z-[70] transition-all duration-200"
                    onclick="event.stopPropagation()"
                    ontouchstart="event.stopPropagation()">
                    <div id="menu-content"></div>
                </div>
            </div>
        </div>

        <!-- Album Art / Video Frame -->
        <div class="flex-1 flex items-center justify-center px-6 relative">
            <div id="video-frame" class="w-full aspect-video bg-zinc-900 rounded-2xl border border-white/10 overflow-hidden relative shadow-2xl flex items-center justify-center video-container">
                <img id="player-thumb" src="" alt="" class="w-full h-full object-cover hidden">
                <i id="player-placeholder" data-lucide="music" class="w-16 h-16 text-white/10"></i>
            </div>
        </div>

        <!-- Info & Controls -->
        <div class="pb-12 px-8 space-y-6">
            <div class="flex items-center justify-between">
                <div class="min-w-0 pr-4">
                    <h2 class="text-2xl font-bold tracking-tight mb-1 truncate" id="player-title">No Track Selected</h2>
                    <p class="text-zinc-400 text-sm truncate" id="player-artist">Tap a song to play</p>
                </div>
                <button onclick="App.Library.toggleLike(event)" class="p-3 bg-zinc-800/50 rounded-full border border-white/10 tap-highlight-none shrink-0">
                    <i id="like-icon" data-lucide="plus" class="w-5 h-5 text-zinc-300"></i>
                </button>
            </div>

            <!-- Progress -->
            <div class="space-y-1">
                <div id="progress-bar-wrap">
                    <div id="progress-track">
                        <div id="progress-fill"></div>
                    </div>
                </div>
                <div class="flex justify-between text-[10px] font-medium text-zinc-500">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

        <!-- Controls -->
            <div class="flex items-center justify-center gap-8 px-4">
                <button class="text-white tap-highlight-none" onclick="App.Player.skip(-1); event.stopPropagation();">
                    <i data-lucide="skip-back" class="w-8 h-8 fill-current"></i>
                </button>
                <button onclick="App.togglePlay(event)" class="h-20 w-20 bg-white text-black rounded-full flex items-center justify-center shadow-xl tap-highlight-none transition-transform active:scale-95">
                    <i id="full-play-icon" data-lucide="pause" class="w-10 h-10 fill-current ml-1"></i>
                </button>
                <button class="text-white tap-highlight-none" onclick="App.Player.skip(1); event.stopPropagation();">
                    <i data-lucide="skip-forward" class="w-8 h-8 fill-current"></i>
                </button>
            </div>
            <button onclick="App.Player.toggleQueue(event)" class="w-full h-11 rounded-xl bg-zinc-900/80 border border-white/10 flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest text-zinc-300 tap-highlight-none">
                <i data-lucide="list-music" class="w-4 h-4"></i>
                Queue
                <span id="queue-count" class="text-zinc-600">0</span>
            </button>
        </div>
    </div>

    <!-- Queue Drawer -->
    <div id="queue-drawer" class="fixed inset-0 z-[90] pointer-events-none">
        <div id="queue-backdrop" onclick="App.Player.toggleQueue(event)" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity"></div>
        <section id="queue-panel" class="absolute left-0 right-0 bottom-0 max-h-[72vh] translate-y-full rounded-t-2xl bg-zinc-950 border-t border-white/10 transition-transform overflow-hidden">
            <div class="h-14 px-5 flex items-center justify-between border-b border-white/10">
                <div class="flex items-center gap-2 min-w-0">
                    <i data-lucide="list-music" class="w-5 h-5 text-zinc-300"></i>
                    <h2 class="text-sm font-black uppercase tracking-widest">Queue</h2>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="App.Player.clearQueue(event)" class="h-9 w-9 rounded-lg hover:bg-white/10 flex items-center justify-center tap-highlight-none" title="Clear queue">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <button onclick="App.Player.toggleQueue(event)" class="h-9 w-9 rounded-lg hover:bg-white/10 flex items-center justify-center tap-highlight-none" title="Close">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="queue-list" class="overflow-y-auto max-h-[calc(72vh-56px)] p-4"></div>
        </section>
    </div>

    <!-- Main View -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="h-20 flex items-center justify-between px-6 z-10">
            <button onclick="App.toggleSidebar()" class="tap-highlight-none">
                <h1 class="text-2xl font-black tracking-tighter uppercase italic">Sansy</h1>
            </button>
        </header>
        <div id="content-area" class="flex-1 w-full px-6 pb-32 overflow-y-auto">
            <div id="view-container" class="w-full"></div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <div id="bottom-dock" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3">
        <button onclick="App.handleDiscClick(event)" class="h-12 w-12 glass-pill rounded-full flex items-center justify-center overflow-hidden border border-white/10 active:scale-90 transition-transform tap-highlight-none">
            <div id="disk-art" class="playing-disk paused w-full h-full p-1.5 opacity-90">
                <img id="disk-img" src="https://placehold.co/100x100/111/ffffff?text=♫" alt="Art" class="w-full h-full object-cover rounded-full">
            </div>
        </button>
        <nav class="glass-pill px-2 py-1 rounded-full flex items-center justify-around w-60 h-12">
            <button onclick="App.setView('home')" id="nav-home" class="flex-1 flex flex-col items-center justify-center gap-0.5 active-nav-item tap-highlight-none">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span class="text-[9px] font-bold tracking-wider uppercase">Home</span>
            </button>
            <button onclick="App.setView('search')" id="nav-search" class="flex-1 flex flex-col items-center justify-center gap-0.5 inactive-nav-item tap-highlight-none">
                <i data-lucide="search" class="w-4 h-4"></i>
                <span class="text-[9px] font-bold tracking-wider uppercase">Search</span>
            </button>
            <button onclick="App.setView('library')" id="nav-library" class="flex-1 flex flex-col items-center justify-center gap-0.5 inactive-nav-item tap-highlight-none">
                <i data-lucide="library" class="w-4 h-4"></i>
                <span class="text-[9px] font-bold tracking-wider uppercase">Library</span>
            </button>
        </nav>
    </div>

    <!-- Feedback Layer -->
    <div id="gesture-feedback" class="fixed inset-0 z-[100] flex items-center justify-center pointer-events-none opacity-0 transition-opacity">
        <div class="bg-black/60 backdrop-blur-md p-6 rounded-full text-white">
            <i id="gesture-icon" data-lucide="check" class="w-10 h-10"></i>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 glass-pill px-5 py-3 rounded-full text-xs font-bold z-[200] opacity-0 transition-opacity pointer-events-none whitespace-nowrap"></div>

    <script>
    const API = `${window.location.origin}/api`;
    const Icons = {
        refresh() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }
    };

    const App = {
        state: {
            isSidebarOpen: false,
            isFullPlayerOpen: false,
            isPlaying: false,
            currentView: 'home',
            isOptionsMenuOpen: false,
            menuView: 'main',
            isQueueOpen: false,
            currentTrack: { id: '', title: '', artist: '', thumbnail: '' },
            discClickCount: 0,
            discClickTimer: null,
            settings: { highQuality: true, dataSaver: false, sleepTimer: 0 }
        },

        _audio: null,

        init() {
            this.Library.init();
            this.Player.initQueue();
            this.Gestures.init();
            this.Player.initSeek();
            this.setView('home');
            window.addEventListener('click', (e) => {
                if (this.state.isOptionsMenuOpen &&
                    !e.target.closest('#options-menu') &&
                    !e.target.closest('[onclick*="toggleOptionsMenu"]')) {
                    this.state.isOptionsMenuOpen = false;
                    this.updateUI();
                }
            });
        },

        trackToken(track) {
            return encodeURIComponent(JSON.stringify({
                id: track.id || '',
                title: track.title || 'Unknown',
                artist: track.artist || 'Unknown',
                thumbnail: track.thumbnail || ''
            })).replace(/'/g, '%27');
        },

        decodeTrack(token) {
            try { return JSON.parse(decodeURIComponent(token)); }
            catch(e) { return null; }
        },

        toast(msg, duration = 2500) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            clearTimeout(this._toastTimer);
            this._toastTimer = setTimeout(() => t.classList.add('opacity-0'), duration);
        },

        handleDiscClick(event) {
            if (event) event.stopPropagation();
            this.state.discClickCount++;
            if (this.state.discClickCount === 1) {
                this.state.discClickTimer = setTimeout(() => {
                    this.toggleFullPlayer();
                    this.state.discClickCount = 0;
                }, 250);
            } else if (this.state.discClickCount === 2) {
                clearTimeout(this.state.discClickTimer);
                this.togglePlay(event);
                this.state.discClickCount = 0;
            }
        },

        toggleSidebar() {
            if (window.matchMedia('(min-width: 1024px)').matches) return;
            this.state.isSidebarOpen = !this.state.isSidebarOpen;
            document.getElementById('sidebar').classList.toggle('-translate-x-full', !this.state.isSidebarOpen);
            const overlay = document.getElementById('sidebar-overlay');
            overlay.classList.toggle('opacity-0', !this.state.isSidebarOpen);
            overlay.classList.toggle('pointer-events-none', !this.state.isSidebarOpen);
        },

        toggleFullPlayer() {
            this.state.isFullPlayerOpen = !this.state.isFullPlayerOpen;
            const player = document.getElementById('full-player');
            player.style.transform = '';
            if (this.state.isFullPlayerOpen) {
                player.classList.remove('translate-y-full');
                player.classList.add('translate-y-0');
            } else {
                player.classList.add('translate-y-full');
                player.classList.remove('translate-y-0');
                this.state.isOptionsMenuOpen = false;
            }
            this.updateUI();
        },

        playTrack(id, title, artist, streamUrl = null, thumbnail = '', fromQueue = false) {
            this.state.currentTrack = { id, title, artist, thumbnail };
            if (!fromQueue) this.Player.startRelatedQueue(this.state.currentTrack);
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-artist').innerText = artist;

            // Update album art
            const thumb = document.getElementById('player-thumb');
            const ph = document.getElementById('player-placeholder');
            const diskImg = document.getElementById('disk-img');
            if (thumbnail) {
                thumb.src = thumbnail;
                thumb.classList.remove('hidden');
                ph.classList.add('hidden');
                diskImg.src = thumbnail;
            } else {
                thumb.classList.add('hidden');
                ph.classList.remove('hidden');
            }

            this.state.isPlaying = true;

            if (!this._audio) {
                this._audio = new Audio();
                this._audio.preload = 'auto';
                this._audio.addEventListener('ended', () => App.Player.skip(1));
            }

            const url = streamUrl || `${API}/proxy/${id}`;
            if (this._audio.dataset.src !== url) {
                this._audio.dataset.src = url;
                this._audio.src = url;
                this._audio.play().catch(e => console.warn('Playback blocked:', e));
                this.Player.startTracking();
            }

            if (!this.state.isFullPlayerOpen) this.toggleFullPlayer();
            else this.updateUI();
        },

        togglePlay(event) {
            if (event) event.stopPropagation();
            this.state.isPlaying = !this.state.isPlaying;
            if (this._audio) {
                if (this.state.isPlaying) {
                    this._audio.play();
                    this.Player.startTracking();
                } else {
                    this._audio.pause();
                    this.Player.stopTracking();
                }
            }
            this.updateUI();
        },

        toggleOptionsMenu(event) {
            if (event) event.stopPropagation();
            this.state.isOptionsMenuOpen = !this.state.isOptionsMenuOpen;
            this.state.menuView = 'main';
            this.updateUI();
        },

        setMenuView(view, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            this.state.menuView = view;
            this.renderOptionsMenu();
        },

        renderOptionsMenu() {
            const container = document.getElementById('menu-content');
            if (!container) return;
            const backBtn = `<button onclick="App.setMenuView('main',event)" ontouchstart="App.setMenuView('main',event)" class="w-full flex items-center gap-2 p-2 text-[10px] font-bold text-zinc-500"><i data-lucide="chevron-left" class="w-3 h-3"></i> BACK</button><div class="h-px bg-white/10 mb-1"></div>`;
            const ic = "w-full flex items-center gap-3 p-3 text-sm font-semibold hover:bg-white/10 rounded-xl transition-colors tap-highlight-none";
            let html = '';
            if (this.state.menuView === 'audio') {
                html = backBtn +
                    `<button class="${ic}" onclick="App.selectQuality('320k',event)" ontouchstart="App.selectQuality('320k',event)">320kbps <span class="text-[9px] text-zinc-500 ml-auto">HIGH</span></button>
                     <button class="${ic}" onclick="App.selectQuality('128k',event)" ontouchstart="App.selectQuality('128k',event)">128kbps</button>`;
            } else if (this.state.menuView === 'video') {
                html = backBtn +
                    `<button class="${ic}" onclick="App.selectQuality('1080p',event)" ontouchstart="App.selectQuality('1080p',event)">1080p <span class="text-[9px] ml-auto">HD</span></button>
                     <button class="${ic}" onclick="App.selectQuality('720p',event)" ontouchstart="App.selectQuality('720p',event)">720p</button>

        selectQuality(q, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const track = this.state.currentTrack;
            if (!track?.title) { this.toast('No track loaded'); return; }

            this.state.isOptionsMenuOpen = false;
            this.updateUI();

            // Streaming quality change — just feedback for now
            if (!q.startsWith('DL-')) {
                this.toast('Quality: ' + q);
                return;
            }

            // Download
            let fmt = 'mp3', quality = '320k';
            if (q === 'DL-128k')  { fmt = 'mp3'; quality = '128k'; }
            else if (q === 'DL-320k')  { fmt = 'mp3'; quality = '320k'; }
            else if (q === 'DL-1080p') { fmt = 'mp4'; quality = '1080p'; }
            else if (q === 'DL-720p')  { fmt = 'mp4'; quality = '720p'; }

            this.toast('Downloading…');
            fetch(`${API}/download?q=${encodeURIComponent(track.title)}&fmt=${fmt}&quality=${quality}`)
                .then(r => r.json())
                .then(data => {
                    if (data.error) { this.toast('Error: ' + data.error.slice(0, 60)); return; }
                    this.toast('Saved: ' + (data.filename || data.path.split('/').pop()));
                    this.Gestures.showFeedback('check');
                })
                .catch(() => this.toast('Backend offline'));
        },

        setView(view) {
            this.state.currentView = view;
            const container = document.getElementById('view-container');
            if (view === 'home')          this.Home.render(container);
            else if (view === 'search')   this.Search.render(container);
            else if (view === 'library')  this.Library.render(container);
            else if (view === 'settings') this.Settings.render(container);
            this.updateUI();

            const disk = document.getElementById('disk-art');
            if (this.state.isPlaying) disk.classList.remove('paused');

            document.getElementById('full-play-icon').setAttribute('data-lucide', this.state.isPlaying ? 'pause' : 'play');
            ['home','search','library'].forEach(v => {
                const el = document.getElementById('nav-' + v);

        // ── Player controls ────────────────────────────────────────────────
        Player: {
            _queue: [],
            _queueIndex: 0,
            _ticker: null,
            _seekBound: false,
            _relatedRequestId: 0,

            initQueue() {
                const saved = localStorage.getItem('s_queue');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this._queue = Array.isArray(data.tracks) ? data.tracks : [];
                        this._queueIndex = Number.isInteger(data.index) ? data.index : 0;
                    } catch(e) {
                        this._queue = [];
                        this._queueIndex = 0;
                    }
                }
            },

            saveQueue() {
                localStorage.setItem('s_queue', JSON.stringify({ tracks: this._queue, index: this._queueIndex }));
            },

            setQueue(tracks, index = 0) {
                this._queue = tracks.filter(t => t && t.id).map(t => ({
                    id: t.id,
                    title: t.title || 'Unknown',
                    artist: t.artist || 'Unknown',
                    thumbnail: t.thumbnail || ''
                }));
                this._queueIndex = Math.max(0, Math.min(index, this._queue.length - 1));
                this.saveQueue();
                this.renderQueue();
            },

            ensureCurrentInQueue(track) {
                if (!track?.id) return;
                const i = this._queue.findIndex(t => t.id === track.id);
                if (i === -1) {
                    this._queue.unshift(track);
                    this._queueIndex = 0;
                } else {
                    this._queueIndex = i;
                }
                this.saveQueue();
                this.renderQueue();
            },

            startRelatedQueue(track) {
                if (!track?.id) return;
                const current = {
                    id: track.id,
                    title: track.title || 'Unknown',
                    artist: track.artist || 'Unknown',
                    thumbnail: track.thumbnail || ''
                };
                const requestId = ++this._relatedRequestId;
                this.setQueue([current], 0);
                App.toast('Loading related songs...');

                fetch(`${API}/related/${current.id}?limit=20`)
                    .then(res => res.json())
                    .then(data => {
                        if (requestId !== this._relatedRequestId) return;
                        const seen = new Set([current.id]);
                        const related = (data.results || [])
                            .filter(t => t && t.id && !seen.has(t.id) && seen.add(t.id))
                            .slice(0, 20)
                            .map(t => ({
                                id: t.id,
                                title: t.title || 'Unknown',
                                artist: t.artist || 'Unknown',
                                thumbnail: t.thumbnail || ''
                            }));
                        this.setQueue([current, ...related], 0);
                        if (related.length) App.toast(`${related.length} related songs queued`);
                    })
                    .catch(() => App.toast('Could not preload related songs'));
            },

            addEncoded(token, event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                const track = App.decodeTrack(token);
                this.add(track);
            },

            playNextEncoded(token, event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                const track = App.decodeTrack(token);
                this.playNext(track);
            },

            add(track) {
                if (!track?.id) return;
                this._queue.push(track);
                this.saveQueue();
                this.renderQueue();
                App.toast('Added to queue');
            },

            playNext(track) {
                if (!track?.id) return;
                const at = Math.min(this._queueIndex + 1, this._queue.length);
                this._queue.splice(at, 0, track);
                this.saveQueue();
                this.renderQueue();
                App.toast('Playing next');
            },

            playAt(index, event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                const track = this._queue[index];
                if (!track) return;
                this._queueIndex = index;
                this.saveQueue();
                App.playTrack(track.id, track.title, track.artist, `${API}/proxy/${track.id}`, track.thumbnail || '', true);
            },

            remove(index, event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                this._queue.splice(index, 1);
                if (index < this._queueIndex) this._queueIndex--;
                if (this._queueIndex >= this._queue.length) this._queueIndex = Math.max(0, this._queue.length - 1);
                this.saveQueue();
                this.renderQueue();
            },

            clearQueue(event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                const current = App.state.currentTrack?.id ? [App.state.currentTrack] : [];
                this._queue = current;
                this._queueIndex = 0;
                this.saveQueue();
                this.renderQueue();
                App.toast('Queue cleared');
            },

            toggleQueue(event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                App.state.isQueueOpen = !App.state.isQueueOpen;
                const root = document.getElementById('queue-drawer');
                const panel = document.getElementById('queue-panel');
                const backdrop = document.getElementById('queue-backdrop');
                root.classList.toggle('pointer-events-none', !App.state.isQueueOpen);
                panel.classList.toggle('translate-y-full', !App.state.isQueueOpen);
                backdrop.classList.toggle('opacity-0', !App.state.isQueueOpen);
                this.renderQueue();
                Icons.refresh();
            },

            renderQueue() {
                const count = document.getElementById('queue-count');
                if (count) count.innerText = String(Math.max(0, this._queue.length - this._queueIndex - 1));
                const list = document.getElementById('queue-list');
                if (!list) return;
                if (this._queue.length === 0) {
                    list.innerHTML = `<p class="text-center text-zinc-500 text-sm py-12">Queue is empty</p>`;
                    return;
                }
                list.innerHTML = this._queue.map((track, index) => {
                    const active = index === this._queueIndex;
                    return `
                        <div class="flex items-center gap-3 p-3 rounded-xl ${active ? 'bg-white/10' : 'hover:bg-white/5'}">
                            <button onclick="App.Player.playAt(${index},event)" class="flex items-center gap-3 min-w-0 flex-1 text-left tap-highlight-none">
                                <img src="${track.thumbnail || 'https://placehold.co/100x100/111/ffffff?text=%E2%99%AB'}" class="w-11 h-11 rounded-lg object-cover shrink-0">
                                <div class="min-w-0">
                                    <p class="text-sm font-bold truncate">${track.title}</p>
                                    <p class="text-xs text-zinc-500 truncate">${active ? 'Now playing' : track.artist}</p>
                                </div>
                            </button>
                            <button onclick="App.Player.remove(${index},event)" class="h-9 w-9 rounded-lg hover:bg-white/10 flex items-center justify-center shrink-0 tap-highlight-none">
                                <i data-lucide="x" class="w-4 h-4 text-zinc-500"></i>
                            </button>
                        </div>`;
                }).join('');
                Icons.refresh();
            },

            skip(dir) {
                const audio = App._audio;
                if (!audio) return;
                if (this._queue.length > 1) {
                    this._queueIndex = (this._queueIndex + dir + this._queue.length) % this._queue.length;
                    const t = this._queue[this._queueIndex];
                    const url = `${API}/proxy/${t.id}`;
                    this.saveQueue();
                    App.playTrack(t.id, t.title, t.artist, url, t.thumbnail || '', true);
                } else {
                    // No queue — seek ±10s
                    if (audio.duration) {
                        audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + dir * 10));
                    }
                }
            },

            formatTime(s) {
                if (!s || isNaN(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60).toString().padStart(2, '0');
                return `${m}:${sec}`;
            },

            initSeek() {
                // Attach once at init using capture phase — fires before any bubbling
                const wrap = document.getElementById('progress-bar-wrap');
                let isScrubbing = false;

                const seekTo = (clientX, commit = true) => {
                    const audio = App._audio;
                    if (!audio || !audio.duration) return;
                    const rect = wrap.getBoundingClientRect();
                    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    const time = pct * audio.duration;
                    const fill = document.getElementById('progress-fill');
                    const cur = document.getElementById('time-current');
                    if (fill) fill.style.width = (pct * 100) + '%';
                    if (cur) cur.innerText = this.formatTime(time);
                    if (commit) audio.currentTime = time;
                };

                wrap.addEventListener('pointerdown', (e) => {
                    isScrubbing = true;
                    wrap.setPointerCapture(e.pointerId);
                    e.preventDefault();
                    e.stopPropagation();
                    seekTo(e.clientX, false);
                }, true);

                wrap.addEventListener('pointermove', (e) => {
                    if (!isScrubbing) return;
                    e.preventDefault();
                    e.stopPropagation();
                    seekTo(e.clientX, false);
                }, true);

                wrap.addEventListener('pointerup', (e) => {
                    if (!isScrubbing) return;
                    isScrubbing = false;
                    e.preventDefault();
                    e.stopPropagation();
                    seekTo(e.clientX, true);
                }, true);
            },

            startTracking() {
                if (this._ticker) clearInterval(this._ticker);
                this._ticker = setInterval(() => {
                    const audio = App._audio;
                    if (!audio || !audio.duration) return;
                    const pct = (audio.currentTime / audio.duration) * 100;
                    const fill = document.getElementById('progress-fill');
                    const cur  = document.getElementById('time-current');
                    const tot  = document.getElementById('time-total');
                    if (fill) fill.style.width = pct + '%';
                    if (cur)  cur.innerText = this.formatTime(audio.currentTime);
                    if (tot)  tot.innerText = this.formatTime(audio.duration);
                }, 500);
            },

            stopTracking() {
                if (this._ticker) clearInterval(this._ticker);
            }
        },

        Home: {

            observeSentinel() {
                const sentinel = document.getElementById('home-scroll-sentinel');
                if (!sentinel) return;
                if (this._observer) this._observer.disconnect();
                this._observer = new IntersectionObserver((entries) => {
                    if (entries.some(entry => entry.isIntersecting)) {
                        this.renderNextBatch();
                    }
                }, {
                    root: document.getElementById('content-area') || null,
                    rootMargin: '240px 0px',
                    threshold: 0.01
                });
                this._observer.observe(sentinel);

                const sentinel = document.getElementById('search-scroll-sentinel');
                if (!sentinel) return;
                if (this._observer) this._observer.disconnect();
                this._observer = new IntersectionObserver((entries) => {
                    if (entries.some(entry => entry.isIntersecting)) {
                        this.renderNextBatch();
                    }
                }, {
                    root: document.getElementById('content-area') || null,
                    rootMargin: '240px 0px',
                    threshold: 0.01
                });
                this._observer.observe(sentinel);
            },
            play() {
                const d = this._lastResult;
                if (!d) return;
                const proxyUrl = `${API}/proxy/${d.id}`;
                App.playTrack(d.id, d.title, d.artist, proxyUrl, d.thumbnail || '');
            },
            playResult(token, queueToken, index, event) {
                if (event) { event.preventDefault(); event.stopPropagation(); }
                const track = App.decodeTrack(token);
                if (!track) return;
                App.playTrack(track.id, track.title, track.artist, `${API}/proxy/${track.id}`, track.thumbnail || '');
            },
            resultRow(track, tracks, index) {
                const token = App.trackToken(track);
                const queueToken = encodeURIComponent(JSON.stringify(tracks.map(t => ({
                    id: t.id,
                    title: t.title || 'Unknown',
                    artist: t.artist || 'Unknown',
                    thumbnail: t.thumbnail || ''
                })))).replace(/'/g, '%27');
                return `
                    <div class="glass-pill p-3 rounded-2xl flex items-center gap-3 mb-3 active:scale-95 transition-transform">
                        <button class="flex items-center gap-3 min-w-0 flex-1 text-left" onclick="App.Search.playResult('${token}','${queueToken}',${index},event)">
                            <img src="${track.thumbnail}" class="w-12 h-12 rounded-xl object-cover shrink-0">
                            <div class="min-w-0">
                                <p class="font-bold text-sm truncate">${track.title}</p>
                                <p class="text-xs text-zinc-500 truncate">${track.artist}</p>
                            </div>
                        </button>
                        <button onclick="App.Player.playNextEncoded('${token}',event)" class="h-10 w-10 rounded-xl hover:bg-white/10 flex items-center justify-center shrink-0 tap-highlight-none" title="Play next">
                            <i data-lucide="corner-down-right" class="w-4 h-4 text-zinc-400"></i>
                        </button>
                        <button onclick="App.Player.addEncoded('${token}',event)" class="h-10 w-10 rounded-xl hover:bg-white/10 flex items-center justify-center shrink-0 tap-highlight-none" title="Add to queue">
                            <i data-lucide="list-plus" class="w-4 h-4 text-zinc-400"></i>
                        </button>
                    </div>`;
            }
        },

        // ── Settings ───────────────────────────────────────────────────────
        Settings: {
            updateSetting(key, val) {
                App.state.settings[key] = val;
                App.Gestures.showFeedback('check');
                this.render(document.getElementById('view-container'));
            },
            render(container) {
                const s = App.state.settings;
                container.innerHTML = `
                    <h2 class="text-4xl font-black tracking-tighter mb-8 italic">SETTINGS</h2>
                    <div class="space-y-6 pb-20">
                        <div class="space-y-3">
                            <p class="text-[10px] uppercase tracking-widest text-zinc-600 font-black px-1">Playback</p>
                            <div class="glass-pill p-5 rounded-[2rem] flex justify-between items-center">
                                <div><p class="font-bold">High Quality Audio</p><p class="text-xs text-zinc-500">320kbps</p></div>
                                <label class="switch"><input type="checkbox" ${s.highQuality?'checked':''} onchange="App.Settings.updateSetting('highQuality',this.checked)"><span class="slider"></span></label>
                            </div>
                            <div class="glass-pill p-5 rounded-[2rem] flex justify-between items-center">
                                <div><p class="font-bold">Data Saver</p><p class="text-xs text-zinc-500">Optimize for mobile data</p></div>
                                <label class="switch"><input type="checkbox" ${s.dataSaver?'checked':''} onchange="App.Settings.updateSetting('dataSaver',this.checked)"><span class="slider"></span></label>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <p class="text-[10px] uppercase tracking-widest text-zinc-600 font-black px-1">Sleep Timer</p>
                            <div class="glass-pill p-5 rounded-[2rem]">
                                <div class="flex gap-2">
                                    ${['Off','15m','30m','60m'].map((label,i) => `
                                        <button onclick="App.Settings.updateSetting('sleepTimer',${i})"
                                            class="flex-1 py-3 rounded-2xl text-[10px] font-black uppercase transition-all ${s.sleepTimer===i?'bg-white text-black':'bg-white/5 text-zinc-400'}">
                                            ${label}
                                        </button>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <p class="text-[10px] uppercase tracking-widest text-zinc-600 font-black px-1">Storage</p>
                            <div class="glass-pill p-5 rounded-[2rem] flex justify-between items-center">
                                <div><p class="font-bold">Download Location</p><p class="text-xs text-zinc-500">~/sansy/sansy_downloads/</p></div>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-zinc-600"></i>
                            </div>
                            <div class="glass-pill p-5 rounded-[2rem] flex justify-between items-center text-red-500"
                                onclick="localStorage.clear(); location.reload();">
                                <div><p class="font-bold">Clear Library Cache</p><p class="text-xs opacity-50">Removes liked songs</p></div>
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <p class="text-[10px] uppercase tracking-widest text-zinc-600 font-black px-1">About</p>
                            <div class="glass-pill p-6 rounded-[2rem] text-center space-y-2">
                                <p class="text-xl font-black italic tracking-tighter text-white">SANSY v3.0.0</p>
                                <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Built for audiophiles</p>
                            </div>
                        </div>
                    </div>`;
                Icons.refresh();
            }
        },

        // ── Gestures ───────────────────────────────────────────────────────
        Gestures: {
            startY: 0, isDragging: false,
            init() {
                const p = document.getElementById('full-player');
                p.addEventListener('touchstart', (e) => {
                    if (e.target.closest('#options-menu') || e.target.closest('button') ||
                        e.target.closest('input') || e.target.closest('#progress-bar-wrap')) return;
                    this.startY = e.touches[0].clientY;
                    this.isDragging = true;
                    p.style.transition = 'none';
                }, {passive: true});
                p.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;
                    const d = e.touches[0].clientY - this.startY;
                    if (d > 0) p.style.transform = `translateY(${d}px)`;
                }, {passive: true});
                p.addEventListener('touchend', (e) => {
                    if (!this.isDragging) return;
                    this.isDragging = false;
                    p.style.transition = '';
                    const d = e.changedTouches[0].clientY - this.startY;
                    if (d > 150) App.toggleFullPlayer(); else p.style.transform = '';
                }, {passive: true});
            },
            showFeedback(icon) {
                const f = document.getElementById('gesture-feedback');
                document.getElementById('gesture-icon').setAttribute('data-lucide', icon);
                Icons.refresh();
                f.classList.remove('opacity-0');
                setTimeout(() => f.classList.add('opacity-0'), 600);
            }
        }
    };

    window.onload = () => App.init();
    </script>
</body>
</html>
